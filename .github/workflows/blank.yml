name: Sajangnim Settlement 1.0.10 Live Ads UMP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract 1.0.10 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="SajangnimSettlement_Android_v69_LIVE_ADS_UMP_1.0.10.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다: $ZIP_FILE"
            exit 1
          fi

          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f "project/SajangnimSettlement/settings.gradle.kts" ]; then
            echo "SajangnimSettlement 프로젝트를 찾을 수 없습니다."
            exit 1
          fi

          echo "===== BUILD TARGET ====="
          grep -E "versionCode|versionName" \
            project/SajangnimSettlement/app/build.gradle.kts
          echo "========================"

      - name: Restore fixed release keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 Secret이 없습니다."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

      - name: Build Release APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -e

          mkdir -p artifacts

          cp \
            project/SajangnimSettlement/app/build/outputs/apk/release/app-release.apk \
            artifacts/SajangnimSettlement-1.0.10-LIVE-ADS-UMP.apk

          cp \
            project/SajangnimSettlement/app/build/outputs/bundle/release/app-release.aab \
            artifacts/SajangnimSettlement-1.0.10-LIVE-ADS-UMP.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-1.0.10-LIVE-ADS-UMP
          path: artifacts/*
