name: Android 16 API 36 Store Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find newest ZIP and extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "선택된 최신 ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -d "project/SajangnimSettlement" ]; then
            echo "압축 안에서 SajangnimSettlement 프로젝트를 찾을 수 없습니다."
            exit 1
          fi

      - name: Show app version being built
        run: |
          echo "===== BUILD TARGET ====="
          grep -E "versionCode|versionName" project/SajangnimSettlement/app/build.gradle.kts || true
          echo "========================"

      - name: Restore signing keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build Release APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-APK
          path: project/SajangnimSettlement/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-PLAY-AAB
          path: project/SajangnimSettlement/app/build/outputs/bundle/release/app-release.aab
