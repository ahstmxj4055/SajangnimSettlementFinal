name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q SajangnimSettlement_Android_v18_PRIVACY_TOAST_FINAL.zip -d project
      - name: Restore signing keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
      - name: Build signed release APK
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-v18-PRIVACY-TOAST-FINAL-APK
          path: project/SajangnimSettlement/app/build/outputs/apk/release/app-release.apk
