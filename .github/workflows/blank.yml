
name: Sajangnim Settlement Auto Build

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest project ZIP
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import glob
          import os
          import re
          import zipfile

          choices = []

          for path in glob.glob("*.zip"):
              try:
                  with zipfile.ZipFile(path) as z:
                      names = z.namelist()

                      gradle = next(
                          (n for n in names
                           if n.endswith("/app/build.gradle.kts")),
                          None
                      )

                      settings = next(
                          (n for n in names
                           if n.endswith("/settings.gradle.kts")),
                          None
                      )

                      if not gradle or not settings:
                          continue

                      data = z.read(gradle).decode("utf-8")

                      match = re.search(
                          r"versionCode\s*=\s*(\d+)",
                          data
                      )

                      if match:
                          choices.append(
                              (int(match.group(1)), path)
                          )

              except (
                  OSError,
                  zipfile.BadZipFile,
                  UnicodeDecodeError
              ):
                  continue

          if not choices:
              raise SystemExit(
                  "No valid Android project ZIP found"
              )

          version, path = max(choices)

          print(
              f"Selected ZIP: {path}, "
              f"versionCode: {version}"
          )

          with zipfile.ZipFile(path) as z:
              z.extractall("project")

          candidates = glob.glob(
              "project/**/settings.gradle.kts",
              recursive=True
          )

          if len(candidates) != 1:
              raise SystemExit(
                  "Expected exactly one Android project"
              )

          project = os.path.dirname(candidates[0])

          if not os.path.isfile(
              project + "/app/build.gradle.kts"
          ):
              raise SystemExit(
                  "Missing app/build.gradle.kts"
              )

          with open(
              os.environ["GITHUB_ENV"], "a"
          ) as f:
              f.write(
                  f"PROJECT_DIR={project}\n"
                  f"BUILD_VERSION={version}\n"
              )
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 36
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "Missing KEYSTORE_BASE64"
            exit 1
          }

          mkdir -p "$PROJECT_DIR/app"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$PROJECT_DIR/app/release-key.jks"

          test -s "$PROJECT_DIR/app/release-key.jks"

      - name: Build signed APK and AAB
        shell: bash
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle assembleRelease bundleRelease \
            --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-build-${{ env.BUILD_VERSION }}
          if-no-files-found: error
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
            ${{ env.PROJECT_DIR }}/app/build/outputs/mapping/release/mapping.txt
