name: Sajangnim Settlement 1.0.11 AD ID Fix Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract 1.0.11 project
        shell: bash
        run: |
          set -e
          ZIP_FILE="SajangnimSettlement_Android_v73_AD_ID_FIX_1.0.11.zip"
          test -f "$ZIP_FILE" || (echo "Missing $ZIP_FILE" && exit 1)
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          test -f project/SajangnimSettlement/settings.gradle.kts
          echo "===== BUILD TARGET ====="
          grep -E "versionCode|versionName" project/SajangnimSettlement/app/build.gradle.kts

      - name: Restore fixed release keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

      - name: Build signed Release APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Collect APK, AAB and mapping
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          cp project/SajangnimSettlement/app/build/outputs/apk/release/app-release.apk \
            artifacts/SajangnimSettlement-1.0.11-AD-ID-FIX.apk

          cp project/SajangnimSettlement/app/build/outputs/bundle/release/app-release.aab \
            artifacts/SajangnimSettlement-1.0.11-AD-ID-FIX.aab

          if [ -f project/SajangnimSettlement/app/build/outputs/mapping/release/mapping.txt ]; then
            cp project/SajangnimSettlement/app/build/outputs/mapping/release/mapping.txt \
              artifacts/mapping-1.0.11.txt
          fi

      - name: Upload APK, AAB and mapping
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-1.0.11-AD-ID-FIX
          path: artifacts/*
