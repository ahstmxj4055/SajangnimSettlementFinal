
name: Sajangnim Settlement v103 Fixed Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android API 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract v103 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="SajangnimSettlement_Android_v103_DIRECT_PDF_PNG_SAVE_1.1.0.zip"
          test -f "$ZIP_FILE" || { echo "Missing ZIP: $ZIP_FILE"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/SajangnimSettlement/settings.gradle.kts
          test -f project/SajangnimSettlement/app/build.gradle.kts
          grep -E 'versionCode|versionName' project/SajangnimSettlement/app/build.gradle.kts

      - name: Restore release keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

      - name: Build signed APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-v103-fixed
          if-no-files-found: error
          path: |
            project/SajangnimSettlement/app/build/outputs/apk/release/*.apk
            project/SajangnimSettlement/app/build/outputs/bundle/release/*.aab
            project/SajangnimSettlement/app/build/outputs/mapping/release/mapping.txt
