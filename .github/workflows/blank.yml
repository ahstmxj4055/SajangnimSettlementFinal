name: Sajangnim Settlement v127 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android API 36
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract v127 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="SajangnimSettlement_Android_v127_PLAY_FIX_1.1.2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          test -f project/SajangnimSettlement/settings.gradle.kts
          test -f project/SajangnimSettlement/app/build.gradle.kts

          grep -E 'versionCode|versionName' \
            project/SajangnimSettlement/app/build.gradle.kts

      - name: Restore release keystore
        working-directory: project/SajangnimSettlement
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "Missing KEYSTORE_BASE64 secret"
            exit 1
          }

          umask 077
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > app/release-key.jks

          test -s app/release-key.jks

      - name: Build signed APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --stacktrace

      - name: Inspect release DEX system-bar references
        working-directory: project/SajangnimSettlement
        shell: bash
        run: |
          python3 tools/check_release_dex.py \
            app/build/outputs/apk/release/app-release.apk \
            > app/build/outputs/release-api-report.json

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="project/SajangnimSettlement/app/build/outputs/apk/release"
          AAB_DIR="project/SajangnimSettlement/app/build/outputs/bundle/release"

          find "$APK_DIR" -name '*.apk' -type f -size +100k | grep -q .
          find "$AAB_DIR" -name '*.aab' -type f -size +100k | grep -q .

          echo "Release files:"
          ls -lh "$APK_DIR"/*.apk "$AAB_DIR"/*.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-v127
          if-no-files-found: error
          path: |
            project/SajangnimSettlement/app/build/outputs/apk/release/*.apk
            project/SajangnimSettlement/app/build/outputs/bundle/release/*.aab
            project/SajangnimSettlement/app/build/outputs/mapping/release/mapping.txt
            project/SajangnimSettlement/app/build/outputs/release-api-report.json

      - name: Remove temporary release keystore
        if: always()
        shell: bash
        run: rm -f project/SajangnimSettlement/app/release-key.jks
