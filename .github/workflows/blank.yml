name: Android 16 API 36 Store Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ZIP from latest commit
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(git diff-tree --no-commit-id --name-only -r HEAD \
            | grep -E '\.zip$' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "최신 커밋에서 ZIP을 찾지 못해 저장소 ZIP 중 마지막 커밋된 파일을 찾습니다."

            ZIP_FILE="$(
              for f in *.zip; do
                [ -f "$f" ] || continue
                printf '%s %s\n' "$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)" "$f"
              done | sort -nr | head -n 1 | cut -d' ' -f2-
            )"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "빌드할 ZIP 파일을 찾을 수 없습니다."
            exit 1
          fi

          echo "선택된 ZIP: $ZIP_FILE"

          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -d "project/SajangnimSettlement" ]; then
            echo "압축 안에서 SajangnimSettlement 프로젝트를 찾을 수 없습니다."
            exit 1
          fi

      - name: Show app version
        run: |
          echo "===== BUILD TARGET ====="
          grep -E "versionCode|versionName" project/SajangnimSettlement/app/build.gradle.kts
          echo "========================"

      - name: Restore signing keystore
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

      - name: Build Release APK and AAB
        working-directory: project/SajangnimSettlement
        env:
          KEYSTORE_FILE: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Collect APK and AAB
        shell: bash
        run: |
          set -e
          rm -rf artifacts
          mkdir artifacts

          echo "===== 실제 생성 파일 ====="
          find project/SajangnimSettlement/app/build/outputs \
            -type f \( -name "*.apk" -o -name "*.aab" \) -print

          APK_FILE="$(find project/SajangnimSettlement/app/build/outputs -type f -name "*.apk" | head -n 1)"
          AAB_FILE="$(find project/SajangnimSettlement/app/build/outputs -type f -name "*.aab" | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "APK가 생성되지 않았습니다."
            exit 1
          fi

          if [ -z "$AAB_FILE" ]; then
            echo "AAB가 생성되지 않았습니다."
            exit 1
          fi

          cp "$APK_FILE" artifacts/SajangnimSettlement-release.apk
          cp "$AAB_FILE" artifacts/SajangnimSettlement-play.aab

          echo "===== 업로드 대상 ====="
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-APK
          path: artifacts/SajangnimSettlement-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SajangnimSettlement-PLAY-AAB
          path: artifacts/SajangnimSettlement-play.aab
          if-no-files-found: error
